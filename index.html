<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unblocked Games | Aiden Nieh</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js"></script>
</head>
<body>
  <main class="app-shell">
    <section id="game-screen" class="screen active-screen">
      <div class="hero-card">
        <div class="hero-badge">Unblocked Games</div>
        <h1>Welcome to Aiden Nieh's Game Portal</h1>
        <p class="subtitle">Pick a game below and have fun.</p>
        <div class="button-row" style="margin-top:32px;">
          <button class="btn game-btn" data-game="ShreckEscape">Shreck Escape</button>
          <button class="btn game-btn" data-game="TemuGeoDash">Geo Dash</button>
          <button class="btn game-btn" data-game="UltraKill">Ultra Kill</button>
        </div>
        <p class="small-copy" style="margin-top:24px;">Designed by Aiden Nieh</p>
      </div>
    </section>
  </main>
</body>
</html>
